{% extends "layout.html" %}

{% block title %}Ilmoituksen poisto{% endblock %}

{% block content %}

<h1>Ilmoituksen poisto</h1>

<p>Ilmoitus: {{ position.stock_name }}</p>
<p>Haluatko varmasti poistaa tämän ilmoituksen?</p>

<form action="/delete_position/{{ position.id }}" method="post">
    <input type="submit" name="delete" value="Poista kohta">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" name="back" value="Palaa takaisin">
</form>

{% endblock %}
