{% extends "layout.html" %}

{% block title %}Muokkaa kommenttia{% endblock %}

{% block content %}

<h2>Muokkaa kommenttia</h2>

<form action="/update_comment/{{ comment.id }}" method="post">
  <p>
    <textarea name="content" rows="6" cols="50" required>{{ comment.content }}</textarea>
  </p>

  <input type="hidden"
         name="csrf_token"
         value="{{ session.csrf_token }}" />

  <input type="submit" value="Päivitä kommentti">
</form>
{% endblock %}
