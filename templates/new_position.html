<!DOCTYPE html>
<html>

<head>
  <title>Uusi kohta</title>
</head>
<body>
  <h1>Uusi kohta</h1>
  <form action="/create_position" method="post">
    <p>
      Osakkeen nimi: <br />
      <input type="text" name="stock_name" />
    </p>
    <p>
      Ex dividend date: <br />
      <input type="date" name="ex_dividend_date" />
    </p>
    <p>
      Record date: <br />
      <input type="date" name="record_date" />
    </p>
    <p>
      Payment date: <br />
      <input type="date" name="payment_date" />
    </p>
    <p>
      Kommentti: <br />
      <textarea name="description" rows="4" cols="30"></textarea>
    </p>
  <p>
    Ala: <br />
    <select name="field">
      <option value="technology">Teknologia</option>
      <option value="finance">Rahoitus</option>
      <option value="healthcare">Terveys</option>
      <option value="energy">Energia</option>
      <option value="IT">Informaatioteknologia</option>
      <option value="banking">Pankit</option>
      <option value="fashion">Kuluttaja</option>
      <option value="logistics">Logistiikka</option>
    </select>
  </p>

  <p>
    Kausi: <br />
    <select name="season">
      <option value="spring">Kevät</option>
      <option value="summer">Kesä</option>
      <option value="autumn">Syksy</option>
      <option value="winter">Talvi</option>
    </select>
  </p>
    <input type="submit" value="Luo uusi kohta" />
  </form>
</body>
</html>
