<!DOCTYPE html>
<html>

<head>
  <title>{{ user.username }}</title>
</head>

<body>
  <h1>Käyttäjä: {{ user.username }}</h1>
  <P>
    Käyttäjällä on yhteensä {{positions | count }} kohtaa.
  </P>  
  <ul>
    {% for position in positions %}
      <li><a href="/positions/{{ position.id }}"> {{ position.stock_name }}</a></li>
    {% endfor %}
  </ul>

  <p>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
